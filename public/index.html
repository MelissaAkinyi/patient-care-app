<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Patient registration, vitals and health assessment application">
  <title>Afya | Patient Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Patient care navigation">
      <a class="brand" href="#/register" aria-label="Afya home">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span class="brand-copy"><span>AfyaCare<span class="brand-dot">.</span></span><small>Kenya health services</small></span>
      </a>
      <p class="eyebrow">Patient workflow</p>
      <nav class="steps" aria-label="Patient workflow steps">
        <a class="step" data-step="register" href="#/register"><span>01</span><div><b>Registration</b><small>Patient details</small></div></a>
        <a class="step disabled" data-step="vitals" href="#/vitals"><span>02</span><div><b>Vitals</b><small>Height &amp; weight</small></div></a>
        <a class="step disabled" data-step="assessment" href="#/assessment"><span>03</span><div><b>Assessment</b><small>Health review</small></div></a>
        <a class="step" data-step="patients" href="#/patients"><span>04</span><div><b>Patients</b><small>Patient records</small></div></a>
      </nav>
      <div class="sidebar-note">
        <span class="pulse"></span>
        <div><strong>Ministry of Health concept</strong><p>A warm, accessible workspace for coordinated patient care.</p></div>
      </div>
    </aside>

    <main id="main-content" tabindex="-1">
      <header class="topbar">
        <div><span class="topbar-badge"><i aria-hidden="true"></i> Clinical workspace</span><strong id="todayText"></strong></div>
        <button class="ghost-button" id="viewPatients" type="button">View all patients <span>→</span></button>
      </header>
      <section id="app" class="page" aria-labelledby="pageTitle"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="/app.js"></script>
</body>
</html>

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patient_care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patient_care"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - patient_care_postgres:/var/lib/postgresql/data

volumes:
  patient_care_postgres:
